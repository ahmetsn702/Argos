<!doctype html>
<meta charset="utf-8"/>
<title>Footprint Tester — compare & hunt</title>
<style>
  :root{--bg:#0b1324;--card:#111a2c;--muted:#93a0b3;--fg:#eaf0ff;--acc:#3b82f6;--ok:#16a34a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto}
  .wrap{max-width:1200px;margin:28px auto;padding:0 16px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 6px 18px #0005}
  h2{margin:0 0 10px 0;font-size:18px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 6px}
  input,textarea,button{width:100%;padding:10px;border-radius:10px;border:1px solid #1e2a41;background:#0c172b;color:var(--fg)}
  button{background:var(--acc);border:none;font-weight:600;cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  pre{white-space:pre-wrap;background:#0c172b;padding:12px;border-radius:10px;max-height:360px;overflow:auto}
  .ok{color:var(--ok);font-weight:700}
  .muted{color:var(--muted)}
  .foot{grid-column:1 / -1;text-align:center;color:#7d89a0;font-size:12px}
</style>
<div class="wrap">
  <div class="card">
    <h2>Compare IG vs X (v2)</h2>
    <label>Kullanıcı adı (IG & X)</label>
    <input id="cmp_user" placeholder="ör. ahmetssyn"/>
    <label>Display name ipucu (opsiyonel)</label>
    <input id="cmp_dn" placeholder="ör. Ahmet Sayın"/>
    <div class="row" style="margin-top:10px">
      <button onclick="cmp()">Karşılaştır</button>
      <button onclick="fillCmp()">Örnek Doldur</button>
    </div>
    <label class="muted" style="margin-top:12px">— sonuç burada —</label>
    <pre id="cmp_out">â€¦</pre>
  </div>

  <div class="card">
    <h2>Hunt X by Name</h2>
    <label>Tam isim</label>
    <input id="hunt_name" placeholder="Ahmet Sayın"/>
    <div class="row">
      <div>
        <label>Limit</label>
        <input id="hunt_limit" value="50"/>
      </div>
      <div>
        <label>Erken dur eşiği (0.5â€“1.0)</label>
        <input id="hunt_stop" value="0.90"/>
      </div>
    </div>
    <label>Keywordâ€™ler (virgülle)</label>
    <input id="hunt_kw" placeholder="Hatay, İskenderun, Yazılım"/>
    <div class="row" style="margin-top:10px">
      <button onclick="hunt()">Ara</button>
      <button onclick="fillHunt()">Örnek Doldur</button>
    </div>
    <label class="muted" style="margin-top:12px">— ham JSON burada —</label>
    <pre id="hunt_out">â€¦</pre>
  </div>

  <div class="card">
    <h2>EXIF / Metadata</h2>
    <input type="file" id="exif_file" accept="image/*"/>
    <div style="margin-top:10px" class="row">
      <button onclick="exif()">Analiz Et</button>
      <button onclick="document.getElementById('exif_out').textContent='â€¦'">Temizle</button>
    </div>
    <pre id="exif_out">â€¦</pre>
  </div>

  <div class="card">
    <h2>Ping</h2>
    <button onclick="ping()">Ping</button>
    <pre id="ping_out">â€¦</pre>
  </div>

  <div class="foot">Footprint Tester â€¢ powered by your local backend</div>
</div>

<script>
const API = "/tester";

const j = x => JSON.stringify(x, null, 2);

async function ping(){
  const r = await fetch(API+"/ping"); const js = await r.json();
  document.getElementById("ping_out").textContent = j(js);
}

async function cmp(){
  const fd = new FormData();
  fd.append("user", document.getElementById("cmp_user").value.trim());
  fd.append("display_name", document.getElementById("cmp_dn").value.trim());
  const r = await fetch(API+"/compare-ig-x", {method:"POST", body:fd});
  document.getElementById("cmp_out").textContent = j(await r.json());
}

function fillCmp(){
  document.getElementById("cmp_user").value = "ahmetssyn";
  document.getElementById("cmp_dn").value   = "Ahmet Sayın";
}

async function hunt(){
  const fd = new FormData();
  fd.append("full_name", document.getElementById("hunt_name").value.trim());
  fd.append("limit",     document.getElementById("hunt_limit").value.trim());
  fd.append("stop_at",   document.getElementById("hunt_stop").value.trim());
  fd.append("keywords",  document.getElementById("hunt_kw").value.trim());
  const r = await fetch(API+"/x-hunt", {method:"POST", body:fd});
  document.getElementById("hunt_out").textContent = j(await r.json());
}

function fillHunt(){
  document.getElementById("hunt_name").value = "Ahmet Sayın";
  document.getElementById("hunt_kw").value   = "Hatay, İskenderun, Yazılım";
}

async function exif(){
  const f = document.getElementById("exif_file").files[0];
  if(!f){ alert("Bir görsel seç."); return; }
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch(API+"/exif", {method:"POST", body:fd});
  document.getElementById("exif_out").textContent = j(await r.json());
}
</script>






























<!-- === IG ZIP indir butonu (auto-inject) === -->
<script>
(function(){
  const $=s=>document.querySelector(s);
  function addZipBtn(){
    if (document.getElementById("dlZipBtn")) return;
    const bar = document.querySelector("form") || document.querySelector(".bar") || document.querySelector("main") || document.body;
    const btn = document.createElement("button");
    btn.id="dlZipBtn"; btn.type="button";
    btn.textContent = "IG Görselleri İndir (ZIP)";
    btn.style.cssText="margin:8px 0;padding:10px 14px;border-radius:10px;background:#1e40af;color:#fff;border:0;cursor:pointer;font-weight:700";
    btn.onclick = async ()=>{
      const inp = document.getElementById("u") || document.querySelector("input");
      const u = (inp && inp.value ? inp.value : "").trim();
      if(!u){ alert("Önce kullanıcı adını yaz."); return; }
      const fd = new URLSearchParams([["user",u],["limit","12"]]);
      const r  = await fetch("/tester/ig-media-zip5",{method:"POST",body:fd});
      if(!r.ok){ alert("İndirme hazırlanamadı."); return; }
      const b  = await r.blob();
      const a  = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = (u||"ig")+"_media.zip";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    };
    // arama çubuğunun altına koy
    if (bar && bar.parentNode) {
      bar.parentNode.insertBefore(btn, bar.nextSibling);
    } else {
      document.body.appendChild(btn);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", addZipBtn); else addZipBtn();
})();
</script>

<!-- pp-card v4 (compact square) -->
<script id="pp-card-v4" defer>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>(s??"").toString().replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));

  function pickPic(p){
    if (p?.hd_profile_pic_url_info?.url) return p.hd_profile_pic_url_info.url;
    if (Array.isArray(p?.hd_profile_pic_versions) && p.hd_profile_pic_versions.length){
      const sorted=p.hd_profile_pic_versions.slice().sort((a,b)=>(b.width||0)-(a.width||0));
      if (sorted[0]?.url) return sorted[0].url;
    }
    return p?.profile_pic_url_hd || p?.profile_pic_url || "";
  }

  async function fetchProfile(user){
    try{
      const r=await fetch("/tester/ig-bio",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams([["user",user]])});
      const j=await r.json(); if (j?.profile) return j.profile;
    }catch(_){}
    return {};
  }

  function ensureCard(){
    let a=$("#ppCard");
    if (a) return a;
    const grid=$(".cards")||$("main")||document.body;
    a=document.createElement("div");
    a.id="ppCard";
    a.style.cssText="grid-column:2;align-self:start;background:#0b1220;border:1px solid #1f2937;border-radius:14px;padding:12px;color:#dbeafe;max-width:100%;width:260px;box-shadow:0 6px 18px rgba(0,0,0,.18)";
    a.innerHTML=[
      '<div id="ppPhoto" style="position:relative;border-radius:12px;overflow:hidden;background:#0b1220;aspect-ratio:1/1;min-height:120px">',
        '<img id="ppCardImg" alt="" referrerpolicy="no-referrer" loading="eager" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">',
      '</div>',
      '<div style="margin-top:10px">',
        '<div id="ppCardName" style="font-weight:800;font-size:14px;line-height:1.25"></div>',
        '<div id="ppCardStats" style="opacity:.85;font-size:12px;margin-top:2px"></div>',
        '<div id="ppCardBio" style="margin-top:6px;font-size:13px;opacity:.95;white-space:pre-wrap"></div>',
      '</div>'
    ].join("");
    (grid&&grid.appendChild)?grid.appendChild(a):document.body.appendChild(a);
    return a;
  }

  async function render(user){
    if(!user) return;
    const p = await fetchProfile(user);
    const card = ensureCard();
    const photo=$("#ppPhoto"), img=$("#ppCardImg"), name=$("#ppCardName"), stats=$("#ppCardStats"), bio=$("#ppCardBio");
    const pic = pickPic(p);

    if (name)  name.innerHTML = esc(p.full_name||"") + (p.username ? ' <span style="opacity:.8">@'+esc(p.username)+'</span>' : '');
    if (stats) stats.textContent = "Takipçi: " + (p.followers??"-") + " · Takip: " + (p.following??"-");
    if (bio)   bio.textContent = p.biography || "";

    if (!pic){ if(img) img.style.display="none"; return; }

    const prox = "/tester/pp-proxy?u="+encodeURIComponent(pic);
    if (img){
      img.onerror = ()=>{ img.onerror=null; img.src = prox; };
      img.src = pic;
      setTimeout(()=>{ if (img.naturalWidth===0){ img.src = prox; } }, 1200);
    }
  }

  function wire(){
    const input=$("#u")||document.querySelector("input");
    const btn=[...document.querySelectorAll("button")].find(b=>/(karşılaştır|göster|ara|getir)/i.test(b.textContent||""));
    const u0=new URL(location.href).searchParams.get("user");
    const go=u=>render((u||"").trim());
    if (u0){ if(input) input.value=u0; go(u0); }
    if (btn && input){ btn.addEventListener("click", ()=> setTimeout(()=>go(input.value), 80)); }
  }
  if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", wire); else wire();
})();
</script>
