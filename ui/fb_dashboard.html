<!doctype html>
<html><head><meta charset="utf-8"/><title>Footprint — Dashboard</title>
<style>
body{font-family:ui-sans-serif,system-ui,Segoe UI,Arial;margin:24px;background:#0b0f19;color:#e6edf3}
h1,h2{margin:6px 0 12px 0}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #1f2937;padding:6px 8px;text-align:left;font-size:14px}
.val{font-family:ui-monospace,Consolas,monospace;background:#0f172a;padding:2px 6px;border-radius:6px}
.ok{color:#10b981}.bad{color:#ef4444}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#1f2937;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
</style></head>
<body><h1>Footprint • Dashboard</h1>
<div id="content">Yükleniyor...</div>
<script>
function fmt(n){const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return n.toFixed(0)+' '+u[i];}
fetch('/dashboard-data').then(r=>r.json()).then(d=>{
  const envRows=d.env.map(r=>`<tr><td>${r.key}</td><td class="val">${r.value}</td></tr>`).join('');
  const secRows=Object.entries(d.secrets).map(([k,v])=>`<tr><td>${k}</td><td>${v.exists?'Yes':'No'}</td><td>${fmt(v.size)}</td></tr>`).join('');
  const dataRows=Object.entries(d.data).map(([k,v])=>`<tr><td>${k}</td><td>${v.count}</td><td>${fmt(v.size)}</td></tr>`).join('');
  document.getElementById('content').innerHTML=`
  <div class="grid">
    <div class="card"><h2>Runtime</h2>
      Python: ${d.python} &nbsp;•&nbsp; ${d.os}<br/>
      Root: <span class="val">${d.root}</span><br/>
      Redis: <span class="${d.redis?'ok':'bad'}">${d.redis?'listening':'not found'}</span><br/>
      Demo: <span class="badge">${d.demo?'ON':'OFF'}</span>
    </div>
    <div class="card"><h2>.env (masked)</h2>
      <table><tr><th>Key</th><th>Value</th></tr>${envRows||'<tr><td colspan=2>Not found</td></tr>'}</table>
    </div>
    <div class="card"><h2>Secrets</h2>
      <table><tr><th>File</th><th>Exists</th><th>Size</th></tr>${secRows}</table>
    </div>
    <div class="card"><h2>Data</h2>
      <table><tr><th>Folder</th><th>Files</th><th>Total</th></tr>${dataRows}</table>
    </div>
  </div>`;
}).catch(e=>{document.getElementById('content').innerHTML='Hata: '+e;});
</script>
</body></html>
