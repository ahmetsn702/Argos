<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Argos — OSINT Platform</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0A;
    --panel: #101012;
    --panel-2: #141417;
    --card: #131316;
    --line: rgba(255,255,255,0.06);
    --line-2: rgba(255,255,255,0.10);
    --text: #ECECEE;
    --muted: #8A8A92;
    --muted-2: #5C5C66;
    --accent: #7C3AED;
    --accent-2: #8B5CF6;
    --accent-soft: rgba(124,58,237,0.12);
    --accent-ring: rgba(124,58,237,0.30);
    --ok: #34D399;
    --warn: #F59E0B;
    --bad: #F87171;
    --info: #60A5FA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
  body{min-height:100vh;font-size:14px;line-height:1.5}
  ::selection{background:var(--accent-soft);color:var(--text)}
  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:10px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.12)}

  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}

  /* ---------- Shell ---------- */
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:18px 18px 14px;border-bottom:1px solid var(--line);
  }
  .brand-mark{
    width:28px;height:28px;border-radius:8px;
    background:linear-gradient(135deg,#7C3AED 0%,#5B21B6 100%);
    display:grid;place-items:center;color:#fff;font-weight:700;
    box-shadow:0 0 0 1px rgba(124,58,237,0.4), 0 8px 24px -8px rgba(124,58,237,0.6);
    position:relative;
  }
  .brand-mark::after{
    content:"";position:absolute;inset:6px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.9);
    border-top-color:transparent;border-right-color:transparent;
  }
  .brand-name{font-weight:600;font-size:15px;letter-spacing:-0.01em}
  .brand-tag{font-size:10px;color:var(--muted-2);letter-spacing:0.18em;text-transform:uppercase;margin-top:-2px}

  .nav{padding:14px 10px;flex:1;overflow-y:auto}
  .nav-section{font-size:10px;color:var(--muted-2);letter-spacing:0.16em;text-transform:uppercase;padding:14px 10px 8px}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:8px;cursor:pointer;
    color:#C9C9CF;font-size:13.5px;font-weight:500;
    position:relative;transition:background .15s, color .15s;
    user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,0.03);color:#fff}
  .nav-item.active{background:var(--accent-soft);color:#fff}
  .nav-item.active::before{
    content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0;
  }
  .nav-item .ic{width:18px;height:18px;color:var(--muted);flex:0 0 18px}
  .nav-item.active .ic{color:var(--accent-2)}
  .nav-item .badge{
    margin-left:auto;font-size:10px;font-weight:600;
    background:rgba(255,255,255,0.04);color:var(--muted);
    padding:2px 6px;border-radius:5px;letter-spacing:0.02em;
  }
  .nav-item.active .badge{background:rgba(124,58,237,0.22);color:#C4B5FD}

  .sidebar-foot{
    padding:12px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:#222;display:grid;place-items:center;
    font-size:12px;font-weight:600;color:#C4B5FD;
    border:1px solid var(--line-2);
  }
  .foot-meta{flex:1;min-width:0}
  .foot-name{font-size:12.5px;font-weight:500;color:#E4E4E7}
  .foot-role{font-size:11px;color:var(--muted-2);display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0}

  .topbar{
    position:sticky;top:0;z-index:5;
    background:rgba(10,10,10,0.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:14px 28px;
    display:flex;align-items:center;gap:14px;
  }
  .smartbar{
    flex:1;display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:0 12px 0 14px;height:42px;
    transition:border-color .15s, box-shadow .15s;
    position:relative;
  }
  .smartbar:focus-within{border-color:var(--accent-ring);box-shadow:0 0 0 4px rgba(124,58,237,0.10)}
  .smartbar svg{flex:0 0 16px;color:var(--muted)}
  .smartbar input{
    flex:1;background:transparent;border:0;outline:0;color:var(--text);
    font-family:inherit;font-size:14px;height:100%;letter-spacing:-0.005em;
  }
  .smartbar input::placeholder{color:var(--muted-2)}
  .type-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 9px;border-radius:6px;font-size:11px;font-weight:500;
    background:rgba(255,255,255,0.04);color:var(--muted);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;
    transition:all .15s;
  }
  .type-pill.t-email{background:rgba(96,165,250,0.10);color:#93C5FD;border-color:rgba(96,165,250,0.20)}
  .type-pill.t-phone{background:rgba(52,211,153,0.10);color:#6EE7B7;border-color:rgba(52,211,153,0.20)}
  .type-pill.t-domain{background:rgba(245,158,11,0.10);color:#FCD34D;border-color:rgba(245,158,11,0.20)}
  .type-pill.t-image{background:rgba(244,114,182,0.10);color:#F9A8D4;border-color:rgba(244,114,182,0.20)}
  .type-pill.t-handle{background:rgba(124,58,237,0.15);color:#C4B5FD;border-color:rgba(124,58,237,0.30)}
  .type-pill .pdot{width:5px;height:5px;border-radius:50%;background:currentColor}

  .kbd{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    padding:2px 6px;border-radius:5px;
    background:rgba(255,255,255,0.04);color:var(--muted-2);
    border:1px solid var(--line);border-bottom-width:2px;
  }

  .top-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:36px;height:36px;display:grid;place-items:center;
    background:transparent;border:1px solid var(--line);border-radius:8px;
    color:var(--muted);cursor:pointer;transition:all .15s;
  }
  .icon-btn:hover{color:#fff;border-color:var(--line-2);background:rgba(255,255,255,0.02)}

  /* ---------- Content ---------- */
  .content{padding:28px 28px 60px;max-width:1240px;width:100%}

  .module-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}
  .module-title{display:flex;align-items:center;gap:14px}
  .module-icon{
    width:44px;height:44px;border-radius:10px;
    background:var(--accent-soft);color:var(--accent-2);
    display:grid;place-items:center;
    border:1px solid rgba(124,58,237,0.20);
  }
  .module-name{font-size:22px;font-weight:600;letter-spacing:-0.02em;margin:0}
  .module-desc{font-size:13px;color:var(--muted);margin:2px 0 0;max-width:560px}

  .toggle{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    font-size:12.5px;color:var(--muted);padding:8px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel-2);
    transition:all .15s;
  }
  .toggle:hover{color:#fff;border-color:var(--line-2)}
  .toggle .sw{
    width:28px;height:16px;border-radius:10px;background:rgba(255,255,255,0.08);
    position:relative;transition:background .2s;flex:0 0 28px;
  }
  .toggle .sw::after{
    content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:#fff;transition:left .2s;
  }
  .toggle.on{color:#fff;border-color:rgba(124,58,237,0.30);background:var(--accent-soft)}
  .toggle.on .sw{background:var(--accent)}
  .toggle.on .sw::after{left:14px}

  /* Form */
  .form-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:20px;
  }
  .form-grid{display:grid;grid-template-columns:1fr auto;gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  .label{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em}
  .input{
    background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:11px 14px;font-family:inherit;font-size:13.5px;outline:0;
    transition:all .15s;
  }
  .input:focus{border-color:var(--accent-ring);box-shadow:0 0 0 4px rgba(124,58,237,0.10)}
  .input.mono{font-family:'JetBrains Mono',monospace;font-size:13px}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:7px;font-size:12px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);
    color:#C9C9CF;cursor:pointer;transition:all .15s;user-select:none;
  }
  .chip:hover{border-color:var(--line-2);color:#fff}
  .chip.on{background:var(--accent-soft);border-color:rgba(124,58,237,0.30);color:#C4B5FD}
  .chip input{display:none}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 18px;border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:500;
    border:1px solid transparent;cursor:pointer;transition:all .15s;
  }
  .btn-primary{
    background:var(--accent);color:#fff;
    box-shadow:0 0 0 1px rgba(124,58,237,0.4), 0 8px 24px -10px rgba(124,58,237,0.6);
  }
  .btn-primary:hover{background:var(--accent-2)}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
  .btn-ghost{background:transparent;border-color:var(--line);color:#C9C9CF}
  .btn-ghost:hover{border-color:var(--line-2);color:#fff;background:rgba(255,255,255,0.02)}

  /* Cards */
  .results{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;position:relative;overflow:hidden;
  }
  .card.span-3{grid-column:span 3}
  .card.span-4{grid-column:span 4}
  .card.span-5{grid-column:span 5}
  .card.span-6{grid-column:span 6}
  .card.span-7{grid-column:span 7}
  .card.span-8{grid-column:span 8}
  .card.span-12{grid-column:span 12}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:var(--muted)}
  .card-title svg{width:14px;height:14px}
  .badge-pill{
    font-size:10.5px;font-weight:500;padding:3px 8px;border-radius:5px;
    background:rgba(255,255,255,0.04);color:var(--muted);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;
  }
  .badge-pill.ok{background:rgba(52,211,153,0.10);color:#6EE7B7;border-color:rgba(52,211,153,0.20)}
  .badge-pill.warn{background:rgba(245,158,11,0.10);color:#FCD34D;border-color:rgba(245,158,11,0.20)}
  .badge-pill.bad{background:rgba(248,113,113,0.10);color:#FCA5A5;border-color:rgba(248,113,113,0.20)}
  .badge-pill.info{background:rgba(96,165,250,0.10);color:#93C5FD;border-color:rgba(96,165,250,0.20)}

  .stat{display:flex;flex-direction:column;gap:4px}
  .stat-num{font-size:28px;font-weight:600;letter-spacing:-0.03em;color:#fff}
  .stat-num.accent{color:#C4B5FD}
  .stat-num.bad{color:#FCA5A5}
  .stat-num.ok{color:#6EE7B7}
  .stat-label{font-size:12px;color:var(--muted)}

  .kv{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;font-size:13px}
  .kv dt{color:var(--muted);font-weight:400}
  .kv dd{margin:0;color:#E4E4E7;font-weight:500}

  .list{display:flex;flex-direction:column;gap:0}
  .list-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 0;border-top:1px solid var(--line);
  }
  .list-item:first-child{border-top:0;padding-top:4px}
  .list-item:last-child{padding-bottom:4px}
  .list-icon{
    width:30px;height:30px;border-radius:7px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--muted);
    font-size:11px;font-weight:600;
    flex:0 0 30px;
  }
  .list-body{flex:1;min-width:0}
  .list-title{font-size:13.5px;font-weight:500;color:#E4E4E7;display:flex;align-items:center;gap:8px}
  .list-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .list-meta{font-size:11.5px;color:var(--muted-2);font-family:'JetBrains Mono',monospace}

  .summary-box{
    padding:14px 16px;background:rgba(124,58,237,0.06);
    border:1px solid rgba(124,58,237,0.20);border-radius:10px;
    display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;
  }
  .summary-box .ic{
    width:28px;height:28px;border-radius:7px;background:rgba(124,58,237,0.20);
    display:grid;place-items:center;color:#C4B5FD;flex:0 0 28px;
  }
  .summary-title{font-size:12.5px;font-weight:500;color:#C4B5FD;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
  .summary-text{font-size:13.5px;color:#E4E4E7;line-height:1.55}

  /* Tech detail block */
  .tech-block{
    margin-top:12px;background:#0B0B0D;border:1px solid var(--line);
    border-radius:8px;padding:12px 14px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;
    color:#A3A3AB;line-height:1.65;
    max-height:240px;overflow:auto;
  }
  .tech-block .k{color:#C4B5FD}
  .tech-block .s{color:#6EE7B7}
  .tech-block .n{color:#FCD34D}
  .tech-block .c{color:var(--muted-2)}

  .progress{
    height:6px;background:rgba(255,255,255,0.05);border-radius:99px;overflow:hidden;
  }
  .progress > span{
    display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#A78BFA);
    border-radius:99px;
  }

  /* Empty/loading states */
  .empty{
    border:1px dashed var(--line-2);border-radius:14px;
    padding:42px 24px;text-align:center;color:var(--muted);
    background:var(--panel);
  }
  .empty .emoji{
    width:46px;height:46px;border-radius:12px;background:var(--panel-2);
    border:1px solid var(--line);margin:0 auto 14px;display:grid;place-items:center;
    color:var(--muted);
  }

  /* image placeholder */
  .img-slot{
    border:1px dashed var(--line-2);border-radius:10px;
    aspect-ratio:4/3;background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 12px, transparent 12px 24px),
      var(--panel-2);
    display:grid;place-items:center;color:var(--muted-2);
    font-family:'JetBrains Mono',monospace;font-size:11px;
  }

  /* heat dots row */
  .heat{display:flex;gap:3px}
  .heat span{width:12px;height:22px;border-radius:3px;background:rgba(255,255,255,0.04)}
  .heat span.h1{background:rgba(124,58,237,0.18)}
  .heat span.h2{background:rgba(124,58,237,0.36)}
  .heat span.h3{background:rgba(124,58,237,0.55)}
  .heat span.h4{background:rgba(124,58,237,0.85)}

  /* fade in */
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .results > *{animation:fadeUp .3s ease both}
  .results > *:nth-child(1){animation-delay:.02s}
  .results > *:nth-child(2){animation-delay:.05s}
  .results > *:nth-child(3){animation-delay:.08s}
  .results > *:nth-child(4){animation-delay:.11s}
  .results > *:nth-child(5){animation-delay:.14s}
  .results > *:nth-child(6){animation-delay:.17s}
  .results > *:nth-child(7){animation-delay:.20s}

  /* spinner */
  .spin{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);border-top-color:#fff;
    animation:spin 0.8s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Graph */
  .graph{
    height:280px;background:
      radial-gradient(circle at center, rgba(124,58,237,0.08) 0%, transparent 60%),
      var(--card);
    border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;
  }
  .node{
    position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;
    transform:translate(-50%,-50%);
  }
  .node-dot{
    width:36px;height:36px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line-2);
    display:grid;place-items:center;color:#C4B5FD;font-size:13px;
  }
  .node.center .node-dot{
    background:var(--accent);color:#fff;border-color:transparent;
    box-shadow:0 0 0 5px rgba(124,58,237,0.15);
  }
  .node-label{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}
  .edge{position:absolute;height:1px;background:linear-gradient(90deg, transparent, rgba(124,58,237,0.30), transparent);transform-origin:0 50%}

  /* scroll padding for sticky topbar */
  html{scroll-padding-top:90px}
</style>
</head>
<body>
  <div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="modules-data.jsx"></script>
<script type="text/babel" src="result-cards.jsx"></script>
<script type="text/babel" src="modules.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
