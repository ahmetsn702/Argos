# ============================================================================
# ARGOS OSINT v4.0 — docker-compose.yml
# ----------------------------------------------------------------------------
# Single service: builds the local Dockerfile, exposes 8000, mounts logs/,
# loads secrets from .env (NOT baked into the image).
#
# Start:  docker compose up --build -d
# Stop:   docker compose down
# Logs:   docker compose logs -f argos
# Health: docker inspect --format='{{json .State.Health}}' <container>
# ============================================================================
services:
  argos:
    build:
      context: .
      dockerfile: Dockerfile
    image: argos-osint:4.0
    container_name: argos-osint
    depends_on:
      neo4j:
        condition: service_healthy

    ports:
      - "8000:8000"

    # All API keys (HIBP_KEY, HUNTER_KEY, EMAILREP_KEY, etc.) must live in .env
    # at the repo root. .dockerignore blocks .env from the image so this
    # injection happens at *runtime* only.
    env_file:
      - .env

    environment:
      - WEB_CONCURRENCY=1
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}

    # Persist runtime logs across container restarts (host ./logs is created
    # automatically if missing).
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    restart: unless-stopped

    # Plan spec: GET /__ping every 30s, 10s timeout, 3 retries.
    # start_period gives the container time to install Playwright browsers if
    # the image was rebuilt and Chromium hasn't fully primed yet.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/__ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Reasonable defaults for an OSINT toolbox. Override via compose override
    # file when running on smaller hosts.
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M


  neo4j:
    image: neo4j:5.20-community
    container_name: argos-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    volumes:
      - argos-neo4j:/data

  redis:
    image: redis:7-alpine
    profiles: ["queue", "full"]
    ports:
      - "6379:6379"

volumes:
  argos-neo4j:
